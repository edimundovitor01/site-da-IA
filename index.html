
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meu Jogo</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      text-align: center;
      color: white;
      background: linear-gradient(135deg, #101025, #252565);
    }

    header {
      padding: 25px 10px;
    }

    h1 {
      color: #00f5ff;
      font-size: 36px;
    }

    #pontuacao {
      font-size: 24px;
      margin: 15px;
    }

    #area {
      position: relative;
      width: 90%;
      max-width: 700px;
      height: 400px;
      margin: 20px auto;
      overflow: hidden;
      background: #171735;
      border: 2px solid #00f5ff;
      border-radius: 15px;
    }

    #alvo {
      position: absolute;
      width: 55px;
      height: 55px;
      border: none;
      border-radius: 50%;
      background: #ff3278;
      box-shadow: 0 0 20px #ff3278;
      cursor: pointer;
      display: none;
    }

    button {
      padding: 12px 24px;
      margin: 8px;
      border: none;
      border-radius: 10px;
      background: #00f5ff;
      color: #101025;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      transform: scale(1.05);
    }

    #mensagem {
      font-size: 18px;
    }
  </style>
</head>

<body>
  <header>
    <h1>🎮 Meu Jogo</h1>
    <p>Clique no alvo o máximo de vezes que conseguir!</p>
  </header>

  <div id="pontuacao">Pontos: 0</div>
  <div id="tempo">Tempo: 30 segundos</div>

  <div id="area">
    <button id="alvo" aria-label="Clique no alvo"></button>
  </div>

  <button id="iniciar">Começar jogo</button>
  <p id="mensagem">Prepare-se para jogar!</p>

  <script>
    const alvo = document.getElementById("alvo");
    const area = document.getElementById("area");
    const pontosTexto = document.getElementById("pontuacao");
    const tempoTexto = document.getElementById("tempo");
    const mensagem = document.getElementById("mensagem");
    const iniciar = document.getElementById("iniciar");

    let pontos = 0;
    let tempo = 30;
    let intervalo;
    let jogando = false;

    function moverAlvo() {
      const maxX = area.clientWidth - alvo.offsetWidth;
      const maxY = area.clientHeight - alvo.offsetHeight;

      alvo.style.left = Math.random() * maxX + "px";
      alvo.style.top = Math.random() * maxY + "px";
    }

    function terminarJogo() {
      clearInterval(intervalo);
      jogando = false;
      alvo.style.display = "none";
      iniciar.disabled = false;
      iniciar.textContent = "Jogar novamente";
      mensagem.textContent =
        `Fim de jogo! Você fez ${pontos} pontos!`;
    }

    iniciar.addEventListener("click", () => {
      if (jogando) return;

      pontos = 0;
      tempo = 30;
      jogando = true;

      pontosTexto.textContent = "Pontos: 0";
      tempoTexto.textContent = "Tempo: 30 segundos";
      mensagem.textContent = "Clique no alvo!";
      iniciar.disabled = true;

      alvo.style.display = "block";
      moverAlvo();

      intervalo = setInterval(() => {
        tempo--;
        tempoTexto.textContent = `Tempo: ${tempo} segundos`;

        if (tempo <= 0) {
          terminarJogo();
        }
      }, 1000);
    });

    alvo.addEventListener("click", () => {
      if (!jogando) return;

      pontos++;
      pontosTexto.textContent = `Pontos: ${pontos}`;
      moverAlvo();
    });
  </script>
</body>
</html>
